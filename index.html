<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Frappe - Premium Quality</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #243028; /* Dark green */
            --text-light: #d1d5c9; /* Off-white */
            --accent-brown: #966b42; /* Brown */
            --accent-light-brown: #b89369; /* Light Brown */
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            overflow-x: hidden;
            background-image: radial-gradient(#304035 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 8%;
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-light);
            font-size: 1.2rem;
            text-decoration: none;
        }

        .logo i {
            font-size: 2rem;
            color: var(--text-light);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        /* Menambahkan style untuk menu aktif */
        nav a:hover, nav a.active {
            color: var(--accent-light-brown);
        }

        .menu-toggle {
            display: none;
            color: var(--accent-light-brown);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Main Hero Section */
        main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8% 50px;
            min-height: 80vh;
            position: relative;
        }

        /* Social Sidebar */
        .social-sidebar {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--accent-brown);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .social-sidebar a {
            color: var(--white);
            background-color: var(--text-light);
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-decoration: none;
            color: var(--accent-brown);
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .social-sidebar a:hover {
            transform: scale(1.1);
        }

        /* Hero Text */
        .hero-text {
            flex: 1;
            padding-left: 50px;
        }

        .hero-text h1 {
            font-size: 5.5rem;
            font-weight: 900;
            line-height: 0.9;
            color: var(--text-light);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .icons-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent-brown);
            padding-bottom: 20px;
            width: fit-content;
        }

        .icons-row i {
            font-size: 2.5rem;
            color: var(--accent-light-brown);
        }

        .hero-text h3 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 400px;
            opacity: 0.8;
        }

        .btn {
            background-color: var(--accent-light-brown);
            color: var(--bg-color);
            border: none;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-brown);
            color: var(--white);
            transform: translateY(-3px);
        }
        
        .btn:disabled {
            background-color: #666;
            cursor: not-allowed;
            transform: none;
        }

        /* Hero Image */
        .hero-image {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .circle-img {
            width: 500px;
            height: 500px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .discount-badge {
            position: absolute;
            top: 50%;
            left: -20px;
            transform: translateY(-50%);
            background-color: var(--accent-brown);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--white);
            font-weight: 900;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .discount-badge span:first-child { font-size: 2.2rem; line-height: 1; }
        .discount-badge span:last-child { font-size: 1.2rem; }

        /* Checkout Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--bg-color);
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            position: relative;
            border: 1px solid var(--accent-brown);
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 1.5rem;
            color: var(--text-light);
            cursor: pointer;
        }

        .modal h2 { margin-bottom: 20px; color: var(--accent-light-brown); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #304035;
            color: var(--white);
        }

        .payment-methods {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .payment-methods label {
            flex: 1;
            background-color: #304035;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 0.9rem;
        }

        .payment-methods input[type="radio"] { display: none; }
        .payment-methods input[type="radio"]:checked + label {
            border-color: var(--accent-light-brown);
            background-color: rgba(184, 147, 105, 0.2);
        }

        /* Responsive */
        @media (max-width: 992px) {
            main { flex-direction: column; text-align: center; padding-top: 40px; }
            .hero-text { padding-left: 0; margin-bottom: 50px; }
            .icons-row { margin: 0 auto 30px; }
            .hero-text p { margin: 0 auto 30px; }
            .hero-text h1 { font-size: 4rem; }
            .circle-img { width: 350px; height: 350px; }
        }

        @media (max-width: 768px) {
            nav ul { display: none; }
            .menu-toggle { display: block; }
            .hero-text h1 { font-size: 3rem; }
            .social-sidebar { display: none; }
            .payment-methods { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-mug-hot"></i>
            <div>EST 22<br>COFFEE</div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="menu-toggle"><i class="fa-solid fa-bars"></i></div>
    </header>

    <main>
        <aside class="social-sidebar">
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </aside>

        <section class="hero-text">
            <h1>Coffee<br>Frappe</h1>
            <div class="icons-row">
                <i class="fa-solid fa-glass-water"></i>
                <i class="fa-solid fa-mug-saucer"></i>
                <i class="fa-solid fa-cup-togo"></i>
            </div>
            <h3>THE PREMIUM QUALITY</h3>
            <p>Nikmati perpaduan sempurna biji kopi pilihan dan krim lembut. Kesegaran yang disajikan khusus untuk menemani hari produktif Anda.</p>
            <button class="btn" onclick="openModal()">Pesan Sekarang</button>
        </section>

        <section class="hero-image">
            <img src="https://images.unsplash.com/photo-1572442388796-11668a67e53d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Coffee" class="circle-img">
            <div class="discount-badge">
                <span>40%</span>
                <span>OFF</span>
            </div>
        </section>
    </main>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-btn" onclick="closeModal()"></i>
            <h2>Detail Pemesanan</h2>
            <form id="orderForm" onsubmit="processOrder(event)">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="namaPelanggan" required placeholder="Masukkan nama Anda">
                </div>
                <div class="form-group">
                    <label>Pesanan</label>
                    <select id="pilihanProduk" required>
                        <option value="Coffee Frappe Original">Coffee Frappe Original - Rp 35.000</option>
                        <option value="Caramel Frappe">Caramel Frappe - Rp 40.000</option>
                        <option value="Mocha Frappe">Mocha Frappe - Rp 40.000</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <div class="payment-methods">
                        <input type="radio" id="pay-qris" name="payment" value="QRIS" checked>
                        <label for="pay-qris"><i class="fa-solid fa-qrcode"></i> QRIS</label>

                        <input type="radio" id="pay-tf" name="payment" value="Transfer Bank">
                        <label for="pay-tf"><i class="fa-solid fa-building-columns"></i> Transfer</label>

                        <input type="radio" id="pay-ewallet" name="payment" value="E-Wallet">
                        <label for="pay-ewallet"><i class="fa-solid fa-wallet"></i> E-Wallet</label>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 15px;">Proses Pembayaran</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('checkoutModal');

        function openModal() {
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Tutup modal jika user klik di luar kotak
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // Fungsi pemrosesan pesanan yang sudah terhubung dengan Google Apps Script
        async function processOrder(e) {
            e.preventDefault();
            
            // PENTING: Ganti tulisan di bawah dengan URL Web App Google Apps Script Anda
            const scriptURL = 'MASUKKAN_URL_WEB_APP_ANDA_DISINI'; 
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = 'Memproses...';
            submitBtn.disabled = true;

            const dataPesanan = {
                nama: document.getElementById('namaPelanggan').value,
                produk: document.getElementById('pilihanProduk').value,
                pembayaran: e.target.querySelector('input[name="payment"]:checked').value
            };

            // Jika scriptURL belum diganti, jalankan simulasi saja
            if(scriptURL === 'MASUKKAN_URL_WEB_APP_ANDA_DISINI') {
                alert(`Simulasi Berhasil!\n\nNama: ${dataPesanan.nama}\nProduk: ${dataPesanan.produk}\nPembayaran: ${dataPesanan.pembayaran}\n\n(Catatan: Untuk menyimpan ke Google Sheets, masukkan URL Web App Anda pada script)`);
                closeModal();
                e.target.reset();
                submitBtn.innerText = 'Proses Pembayaran';
                submitBtn.disabled = false;
                return;
            }

            // Jika scriptURL sudah diisi, kirim data ke Google Sheets
            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(dataPesanan),
                });

                const result = await response.json();
                
                if (result.result === 'success') {
                    alert('Pesanan Berhasil! Data telah tersimpan di Google Sheets.');
                    closeModal();
                    e.target.reset();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error('Error!', error.message);
                alert('Terjadi kesalahan saat mengirim pesanan. Pastikan URL Web App sudah benar.');
            } finally {
                submitBtn.innerText = 'Proses Pembayaran';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
