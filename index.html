<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #243028; --text-light: #d1d5c9; --accent-brown: #966b42; --accent-light-brown: #b89369; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); background-image: radial-gradient(#304035 1px, transparent 1px); background-size: 20px 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 8%; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 2px; font-size: 1.2rem; color: var(--text-light); text-decoration: none; }
        nav ul { list-style: none; display: flex; gap: 40px; }
        nav a { text-decoration: none; color: var(--text-light); font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--accent-light-brown); }
        main { display: flex; align-items: center; justify-content: space-between; padding: 0 8% 50px; min-height: 80vh; }
        .hero-text h1 { font-size: 5rem; font-weight: 900; line-height: 0.9; text-transform: uppercase; margin-bottom: 30px; }
        .btn { background-color: var(--accent-light-brown); color: var(--bg-color); border: none; padding: 15px 35px; font-size: 1rem; font-weight: 800; border-radius: 30px; cursor: pointer; }
        .circle-img { width: 450px; height: 450px; border-radius: 50%; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-color); padding: 40px; border-radius: 15px; width: 90%; max-width: 500px; border: 1px solid var(--accent-brown); }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 5px; border: none; background: #304035; color: white; margin-top: 5px; }
    </style>
</head>
<body>
    <header>
        <a href="<?= getScriptUrl(); ?>?page=index" class="logo"><i class="fa-solid fa-mug-hot"></i><div>EST 22<br>COFFEE</div></a>
        <nav>
            <ul>
                <li><a href="<?= getScriptUrl(); ?>?page=index" class="active">Home</a></li>
                <li><a href="<?= getScriptUrl(); ?>?page=menu">Menu</a></li>
                <li><a href="<?= getScriptUrl(); ?>?page=services">Services</a></li>
                <li><a href="<?= getScriptUrl(); ?>?page=contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-text">
            <h1>Coffee<br>Frappe</h1>
            <p style="margin-bottom: 30px; max-width: 450px; opacity: 0.8;">Nikmati perpaduan sempurna biji kopi pilihan dan krim lembut khas Sidoarjo.</p>
            <button class="btn" onclick="openModal()">Pesan Sekarang</button>
        </section>
        <section class="hero-image">
            <img src="https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=800&q=80" class="circle-img">
        </section>
    </main>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h2 style="color:var(--accent-light-brown); margin-bottom:20px;">Detail Pemesanan</h2>
            <form onsubmit="processOrder(event)">
                <div class="form-group"><label>Nama</label><input type="text" id="custName" required></div>
                <div class="form-group"><label>Produk</label>
                    <select id="custProduct">
                        <option>Coffee Frappe Original</option>
                        <option>Caramel Frappe</option>
                    </select>
                </div>
                <div class="form-group"><label>Pembayaran</label>
                    <select id="custPay"><option>QRIS</option><option>Transfer Bank</option></select>
                </div>
                <button type="submit" class="btn" style="width:100%" id="btnSubmit">Kirim Pesanan</button>
            </form>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('checkoutModal').style.display='flex'; }
        window.onclick = function(e) { if(e.target.id == 'checkoutModal') document.getElementById('checkoutModal').style.display='none'; }

        async function processOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerText = 'Memproses...';

            const payload = {
                nama: document.getElementById('custName').value,
                produk: document.getElementById('custProduct').value,
                pembayaran: document.getElementById('custPay').value
            };

            try {
                const response = await fetch('<?= getScriptUrl(); ?>', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                if(res.result === 'success') {
                    alert('Pesanan berhasil dicatat!');
                    document.getElementById('checkoutModal').style.display='none';
                }
            } catch (err) { alert('Terjadi kesalahan!'); }
            btn.disabled = false; btn.innerText = 'Kirim Pesanan';
        }
    </script>
</body>
</html>v
