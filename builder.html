<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Page Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; background: #eee; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR ALAT (TOOLS) */
        .sidebar { width: 250px; background: #111; color: white; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 10px; color: #c59b6d; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tool-btn { background: #222; color: white; border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; transition: 0.2s; }
        .tool-btn:hover { background: #c59b6d; color: #111; }
        .tool-btn i { margin-right: 10px; }
        
        .save-btn { background: #198754; color: white; border: none; padding: 15px; margin-top: auto; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* KANVAS KERJA */
        .canvas-wrapper { flex: 1; padding: 40px; overflow-y: auto; }
        #canvas { background: white; min-height: 100%; border-radius: 10px; padding: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        
        /* Elemen di dalam kanvas */
        #canvas > * { position: relative; padding: 10px; margin-bottom: 15px; border: 1px solid transparent; transition: 0.2s; }
        #canvas > *:hover { border: 1px dashed #c59b6d; }
        
        /* Tombol Hapus pada elemen */
        .delete-btn { display: none; position: absolute; top: -10px; right: -10px; background: red; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; z-index: 10; }
        #canvas > *:hover .delete-btn { display: block; }
        
        /* Style Default Elemen Baru */
        .builder-heading { font-size: 2.5rem; font-weight: 800; color: #111; }
        .builder-text { font-size: 1rem; color: #666; line-height: 1.6; }
        .builder-img { width: 100%; max-width: 400px; border-radius: 10px; }
        .builder-btn { display: inline-block; background: #c59b6d; color: white; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar" data-html2canvas-ignore="true">
        <h2>🛠️ Tambah Elemen</h2>
        <button class="tool-btn" onclick="addEl('heading')"><i class="fa-solid fa-heading"></i> Tambah Judul Besar</button>
        <button class="tool-btn" onclick="addEl('paragraph')"><i class="fa-solid fa-align-left"></i> Tambah Paragraf</button>
        <button class="tool-btn" onclick="addEl('image')"><i class="fa-regular fa-image"></i> Tambah Gambar</button>
        <button class="tool-btn" onclick="addEl('button')"><i class="fa-solid fa-link"></i> Tambah Tombol</button>
        
        <div style="margin-top: 20px; font-size: 0.8rem; color:#aaa; line-height: 1.5;">
            * Arahkan kursor ke elemen untuk menghapusnya.<br>
            * Klik langsung pada teks untuk mengedit.
        </div>

        <button class="save-btn" onclick="exportWebsite()"><i class="fa-solid fa-download"></i> Simpan Halaman</button>
    </div>

    <div class="canvas-wrapper">
        <div id="canvas">
            <div class="builder-heading" contenteditable="true">Mulai Bangun Halaman Anda<button class="delete-btn" onclick="this.parentElement.remove()">X</button></div>
            <div class="builder-text" contenteditable="true">Klik teks ini untuk mengubah isinya. Anda dapat menambahkan elemen baru melalui menu di sebelah kiri.<button class="delete-btn" onclick="this.parentElement.remove()">X</button></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');

        function createDeleteBtn() {
            return `<button class="delete-btn" onclick="this.parentElement.remove()" data-html2canvas-ignore="true">X</button>`;
        }

        // Fungsi menambah elemen ke kanvas
        function addEl(type) {
            let el = document.createElement('div');
            el.style.position = 'relative';

            if (type === 'heading') {
                el.className = 'builder-heading';
                el.contentEditable = true;
                el.innerHTML = 'Judul Baru Anda' + createDeleteBtn();
            } 
            else if (type === 'paragraph') {
                el.className = 'builder-text';
                el.contentEditable = true;
                el.innerHTML = 'Ketik paragraf atau deskripsi Anda di sini...' + createDeleteBtn();
            }
            else if (type === 'image') {
                let url = prompt("Masukkan Link URL Gambar:", "https://images.unsplash.com/photo-1511920170033-f8396924c348?w=500");
                if(!url) return;
                el.innerHTML = `<img src="${url}" class="builder-img">` + createDeleteBtn();
            }
            else if (type === 'button') {
                let text = prompt("Nama Tombol:", "Klik Disini");
                let link = prompt("URL Tujuan Tombol:", "menu.html");
                if(!text) return;
                el.innerHTML = `<a href="${link}" class="builder-btn">${text}</a>` + createDeleteBtn();
            }

            canvas.appendChild(el);
        }

        // Fungsi Export HTML Bersih
        function exportWebsite() {
            let clone = canvas.cloneNode(true);
            
            // Bersihkan elemen yang tidak perlu dibawa ke hasil akhir
            clone.querySelectorAll('.delete-btn').forEach(btn => btn.remove());
            clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));

            // Template struktur dasar HTML
            let htmlContent = `
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Kustom</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #fff; padding: 50px 10%; color: #333; }
        .builder-heading { font-size: 2.5rem; font-weight: 800; color: #111; margin-bottom: 15px; }
        .builder-text { font-size: 1rem; color: #666; line-height: 1.6; margin-bottom: 15px; }
        .builder-img { width: 100%; max-width: 600px; border-radius: 10px; margin-bottom: 15px; }
        .builder-btn { display: inline-block; background: #c59b6d; color: white; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    ${clone.innerHTML}
</body>
</html>`;

            let blob = new Blob([htmlContent], { type: 'text/html' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'halaman-kustom.html';
            a.click();
        }
    </script>
</body>
</html>
