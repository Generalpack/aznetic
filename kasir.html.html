<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir - Coffee Frappe</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f0f2f5; padding: 30px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #111; }
        .btn-download { background: #198754; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .btn-download:hover { background: #157347; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #111; color: white; }
        tr:hover { background: #f9f9f9; }
        .badge { background: #ffc107; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        #status { font-size: 0.9rem; color: #666; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dashboard Kasir <span id="orderCount" style="color:#c59b6d"></span></h1>
        <button class="btn-download" onclick="downloadCSV()"><i class="fa-solid fa-file-excel"></i> Download Laporan (CSV)</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Waktu Pesanan</th>
                <th>Nama Pelanggan</th>
                <th>Menu Dipesan</th>
                <th>Metode Bayar</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5" style="text-align:center;">Memuat data dari server...</td></tr>
        </tbody>
    </table>
    <span id="status">Terhubung ke Server. Update otomatis setiap 5 detik...</span>

    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwC4rTG1HXvWzqdhu3R2R9RhQlK8Rtx5sDTF_j5EDVMIvqqDeUSDAdL7dthrXGA9OAG/exec'; 
        let currentOrderCount = 0;
        let globalOrders = [];

        async function fetchOrders() {
            try {
                const response = await fetch(GAS_URL + "?action=getOrders");
                const orders = await response.json();
                globalOrders = orders;
                
                // Jika ada pesanan baru, bunyikan alarm
                if(orders.length > currentOrderCount) {
                    if(currentOrderCount > 0) { 
                        document.getElementById('notifSound').play().catch(e => console.log("Izin audio diperlukan browser")); 
                    }
                    currentOrderCount = orders.length;
                    document.getElementById('orderCount').innerText = `(${currentOrderCount} Pesanan)`;
                    updateTable(orders);
                }
            } catch (error) {
                console.log("Menunggu sinkronisasi...");
            }
        }

        function updateTable(orders) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Bersihkan tabel
            
            // Tampilkan dari yang paling baru (dibalik)
            orders.reverse().forEach(order => {
                const date = new Date(order.waktu).toLocaleString('id-ID');
                tbody.innerHTML += `
                    <tr>
                        <td>${date}</td>
                        <td style="font-weight:600;">${order.nama}</td>
                        <td>${order.produk}</td>
                        <td>${order.pembayaran}</td>
                        <td><span class="badge">${order.status}</span></td>
                    </tr>
                `;
            });
        }

        function downloadCSV() {
            if(globalOrders.length === 0) return alert("Belum ada data.");
            let csv = "Waktu,Nama,Produk,Pembayaran,Status\n";
            globalOrders.forEach(o => {
                csv += `"${o.waktu}","${o.nama}","${o.produk}","${o.pembayaran}","${o.status}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Laporan_Pesanan.csv');
            a.click();
        }

        // Jalankan fetch pertama kali, lalu ulangi setiap 5 detik
        fetchOrders();
        setInterval(fetchOrders, 5000);
    </script>
</body>
</html>
